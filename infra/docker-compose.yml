services:
  postgres:
    image: postgres:16-alpine
    container_name: canva-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-canva}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-canva_secret}
      POSTGRES_DB: ${POSTGRES_DB:-canva_db}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-canva} -d ${POSTGRES_DB:-canva_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: canva-redis
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  postgres_data:
  redis_data:
